<text x="40" y="600" class="accent">PXE sequence · Exactly one responder</text><text x="40" y="636">WDS01 → Custom ADK WinPE → Windows Setup from read-only share</text><text x="40" y="674">Planned handoff: disable and power off WDS01 → prove PXE timeout</text><text x="40" y="706">Then enable CM01 PXE. No concurrent responders.</text><text x="40" y="754" class="small">Solid lines: switch connections. Dashed boxes: planned roles. Source: ad-pxe-lab docs.</text></svg>